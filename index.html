<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mapa de Arriendo - Los Ángeles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="sidebar">
    <h1>Mapa de Arriendo</h1>
    <p>Los Ángeles, Chile</p>

    <h3>Pesos personalizados</h3>

    <label>Trabajo: <span id="trabajoVal">40</span>%</label>
    <input type="range" id="pesoTrabajo" min="0" max="100" value="40" />

    <label>Supermercados: <span id="superVal">25</span>%</label>
    <input type="range" id="pesoSuper" min="0" max="100" value="25" />

    <label>CESFAM: <span id="cesfamVal">20</span>%</label>
    <input type="range" id="pesoCesfam" min="0" max="100" value="20" />

    <label>Gym: <span id="gymVal">15</span>%</label>
    <input type="range" id="pesoGym" min="0" max="100" value="15" />

    <button id="recalcular">Recalcular</button>

    <div id="ranking">
      <h3>Ranking candidatos</h3>
      <ol id="rankingList"></ol>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
